packages:
  - apps/*
  - packages/*

# Everything but published runtime ranges is pinned exactly (see CLAUDE.md).
saveExact: true

# Links the caret ranges on `@siftline/core` to the workspace copy, not the registry.
linkWorkspacePackages: true

# The only dependencies allowed to run install scripts.
allowBuilds:
  esbuild: true
  workerd: true

# vp picks Node from .node-version and pnpm from packageManager; pnpm must not switch them.
pmOnFail: ignore
runtimeOnFail: ignore

catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vite-plus: 1.3.0
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
