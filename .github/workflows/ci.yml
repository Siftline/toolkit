name: CI

on:
  pull_request:
  push:
    branches: [main]

# PRs cancel their own superseded runs; main never cancels, so every commit on the
# trunk is verified.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # With no version input, setup-bun reads `packageManager` from package.json.
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Install (frozen lockfile)
        run: bun ci

      - name: Check
        run: bun run check
