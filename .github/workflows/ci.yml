name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # `changeset status --since=origin/main` needs origin/main to exist locally.
          fetch-depth: 0

      - name: Set up the toolchain
        uses: ./.github/actions/setup

      - name: Check
        run: bun run check

      # Skipped on the version PR, and only there: that branch consumes the changesets
      # as it bumps, so it can never pass a gate it has to merge through.
      - name: Require a changeset
        if: github.head_ref != 'changeset-release/main'
        run: bun changeset status --since=origin/main

  deploy:
    name: deploy docs
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Never cancel: uploading assets is not atomic, so a cancelled deploy can leave the
    # manifest and the uploaded files disagreeing.
    concurrency:
      group: deploy-docs
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up the toolchain
        uses: ./.github/actions/setup

      - name: Build the docs site
        run: bun turbo run build --filter=@siftline/docs

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/docs
          # Detection only looks inside `workingDirectory` and the lockfile is at the repo
          # root; without this the action falls back to npm.
          packageManager: bun
          # No `wranglerVersion` on purpose: the action then uses the wrangler this repo
          # already pins and installs nothing.
          preCommands: |
            wrangler deploy --dry-run --outdir .wrangler/dry-run
            ./scripts/assert-no-secret-assets.sh
          command: deploy
