name: CI

on:
  pull_request:
  push:
    branches: [main]

# PRs cancel their own superseded runs; main never cancels, so every commit on the
# trunk is verified.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # `changeset status --since=origin/main` needs origin/main to exist locally.
          # The default shallow fetch does not create that remote-tracking ref.
          fetch-depth: 0

      # With no version input, setup-bun reads `packageManager` from package.json.
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Install (frozen lockfile)
        run: bun ci

      - name: Check
        run: bun run check

      # Fails when a published package changed without a changeset. `bun changeset
      # --empty` is the deliberate "no release needed" escape hatch. On a push to main
      # the diff is against the same commit, so nothing changed and the step is a no-op.
      - name: Require a changeset
        run: bun changeset status --since=origin/main

  # The docs site is static: `turbo run build --filter=@siftline/docs` prerenders it and
  # wrangler uploads `.output/public` as Cloudflare assets. Nothing runs on the edge, so a
  # broken deploy can only show up as a failed job here, never as a runtime error.
  deploy:
    name: deploy docs
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Its own group, overriding the workflow's: uploading assets is not atomic, so a
    # cancelled deploy can leave the manifest and the uploaded files disagreeing. Queue
    # instead, never cancel.
    concurrency:
      group: deploy-docs
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      # Not `--production`: the docs build runs typedoc over core's source, which is a
      # devDependency, and Vite and wrangler are too.
      - name: Install (frozen lockfile)
        run: bun ci

      - name: Build the docs site
        run: bun turbo run build --filter=@siftline/docs

      # `preCommands` run in `workingDirectory` after the action has resolved wrangler, and
      # a non-zero exit fails the job — so the dry run and the guard both gate the deploy
      # that follows them. The dry run needs no credentials; it parses wrangler.jsonc and
      # reads the asset directory without uploading anything.
      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/docs
          # Detection only looks inside `workingDirectory`, and the lockfile is at the repo
          # root. Without this the action falls back to npm and `npm i`s wrangler into a
          # Bun workspace.
          packageManager: bun
          # No `wranglerVersion` on purpose: with none given the action uses the wrangler
          # this repo already pins (4.135.0 in apps/docs) and installs nothing.
          preCommands: |
            wrangler deploy --dry-run --outdir .wrangler/dry-run
            ./scripts/assert-no-secret-assets.sh
          command: deploy
