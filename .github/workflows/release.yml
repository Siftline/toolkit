name: Release

# `workflows:` matches ci.yml's `name:`, not its filename — keep the two in sync.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions: {}

# Never cancel: a half-published run would leave npm and the git tags disagreeing.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  select-mode:
    name: select mode
    # `workflow_run` fires for failures and for every branch, so the conclusion and branch
    # guards are load-bearing. So is head_sha/github.sha: the changesets sub-actions create
    # refs from `github.sha`, which is not the commit CI verified if main moved meanwhile.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_sha == github.sha
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
      publish-plan-artifact-id: ${{ steps.select-mode.outputs.publish-plan-artifact-id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Set up the toolchain
        uses: ./.github/actions/setup

      - name: Select mode
        id: select-mode
        uses: changesets/action/select-mode@v2.1.2

  # Changesets are queued: open or update the "Version Packages" pull request.
  version:
    name: version
    needs: select-mode
    if: needs.select-mode.outputs.mode == 'version'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Set up the toolchain
        uses: ./.github/actions/setup

      - name: Version packages
        uses: changesets/action/version@v2.1.2
        with:
          pr-base-branch: main

  pack:
    name: pack
    needs: select-mode
    if: needs.select-mode.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      pack-dir-artifact-id: ${{ steps.pack.outputs.pack-dir-artifact-id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Set up the toolchain
        uses: ./.github/actions/setup

      # `files: ["dist"]`, so npm pack needs the build to have run.
      - name: Build
        run: bun run build

      - name: Pack
        id: pack
        uses: changesets/action/pack@v2.1.2
        with:
          publish-plan-artifact-id: ${{ needs.select-mode.outputs.publish-plan-artifact-id }}

  publish:
    name: publish
    needs: pack
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Set up the toolchain
        uses: ./.github/actions/setup

      - name: Publish
        uses: changesets/action/publish@v2.1.2
        with:
          pack-dir-artifact-id: ${{ needs.pack.outputs.pack-dir-artifact-id }}
