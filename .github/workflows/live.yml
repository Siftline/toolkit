name: Live

# Manual only: these tests spend real TypeSafe calls.
on:
  workflow_dispatch:

permissions:
  contents: read

# One at a time, never cancelled: both concurrency and cancellation bill real Jev calls.
concurrency:
  group: live
  cancel-in-progress: false

jobs:
  live:
    name: core test:live
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up the toolchain
        uses: ./.github/actions/setup

      - name: Run live tests
        run: bun run test:live
        working-directory: packages/core
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
