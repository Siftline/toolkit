name: Live

# Manual only: these tests spend real TypeSafe calls, so they never run on a PR.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    name: core test:live
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # With no version input, setup-bun reads `packageManager` from package.json.
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Install (frozen lockfile)
        run: bun ci

      - name: Run live tests
        run: bun run test:live
        working-directory: packages/core
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
